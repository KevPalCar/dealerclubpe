<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - DealerClub</title>
    <link rel="icon" href="/assets/images/favicon_pokerchips.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/auth.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body data-page="login">
    <div id="announce-bar" class="announce-bar" style="display: none;">
        <p id="announce-text"></p>
        <button id="close-announce-bar"><i class="fas fa-times"></i></button>
    </div>
    
    <header class="auth-header">
        <div class="logo">
            <a href="/"><img src="/assets/images/isotipo_principal.png" alt="DealerClub Logo"></a>
        </div>
    </header>

    <main class="auth-main">
        <section id="login-section" class="auth-container">
            <h2>Inicia Sesión en tu Cuenta</h2>
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Correo Electrónico:</label>
                    <input type="email" id="loginEmail" placeholder="tu@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña:</label>
                    <input type="password" id="loginPassword" placeholder="Tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                <div id="login-message" class="message"></div>
                <p class="auth-link">¿No tienes cuenta? <a href="/registro">Regístrate aquí</a></p>
                <p class="auth-link mt-4"><a href="#" id="forgot-password-link">¿Olvidaste tu contraseña?</a></p>
            </form>
        </section>
    </main>

    <footer class="auth-footer">
        <p>&copy; 2025 DealerClub. Todos los derechos reservados.</p>
    </footer>

    <div id="resetPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="closeResetPasswordModalBtn">&times;</span>
            <h2 class="text-xl font-bold text-center">Restablecer Contraseña</h2>
            <form id="reset-password-form">
                <div class="form-group">
                    <label for="resetEmail">Ingresa tu correo electrónico:</label>
                    <input type="email" id="resetEmail" placeholder="tu@ejemplo.com" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    Enviar Enlace de Restablecimiento
                </button>
                <div id="reset-message" class="message mt-4 text-center"></div>
            </form>
        </div>
    </div>

    <script type="module" src="/assets/js/login.js"></script>
</body>
</html>
