<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Virtual - DealerClub</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/student_dashboard.css">
    <link rel="icon" href="../assets/images/favicon_pokerchips.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<!-- Overlay mientras se verifica la sesión -->
<div id="auth-overlay" class="auth-overlay">
    <div class="spinner-large"></div>
    <p>Verificando sesión…</p>
</div>

<!-- Announce bar del dashboard -->
<div id="announce-bar" class="announce-bar" style="display:none;">
    <p id="announce-text"></p>
    <button id="close-announce-bar"><i class="fas fa-times"></i></button>
</div>

<!-- Todo el cuerpo está oculto hasta que pase el guard de auth -->
<div id="dash-body" style="visibility:hidden;">

    <!-- ── HEADER ──────────────────────────────────────────── -->
    <header class="dash-header">
        <div class="dash-logo">
            <a href="../index.html">
                <img src="../assets/images/isotipo_principal.png" alt="DealerClub">
            </a>
        </div>

        <div class="dash-user-info">
            <div class="dash-welcome">
                <span class="dash-hello">Hola,</span>
                <strong id="dash-welcome-name">Estudiante</strong>
            </div>
            <code id="dash-student-code" class="dash-code"></code>
            <span id="dash-level-pill" class="level-pill level-rookie">Rookie</span>
        </div>

        <div class="dash-header-right">
            <a href="#" id="dash-logout-btn" class="btn-logout">
                <i class="fas fa-sign-out-alt"></i> Salir
            </a>
        </div>
    </header>

    <!-- ── TABS DE NAVEGACIÓN ──────────────────────────────── -->
    <nav class="dash-tabs">
        <button class="tab-btn" data-tab="courses">
            <i class="fas fa-graduation-cap"></i>
            <span>Mis Cursos</span>
        </button>
        <button class="tab-btn" data-tab="progress">
            <i class="fas fa-chart-line"></i>
            <span>Mi Progreso</span>
        </button>
        <button class="tab-btn" data-tab="tasks">
            <i class="fas fa-tasks"></i>
            <span>Mis Tareas</span>
        </button>
        <button class="tab-btn" data-tab="materials">
            <i class="fas fa-book-open"></i>
            <span>Material</span>
        </button>
    </nav>

    <!-- ── CONTENIDO DE TABS ───────────────────────────────── -->
    <main class="dash-main">

        <!-- TAB: MIS CURSOS -->
        <section id="panel-courses" class="tab-panel">
            <div class="panel-header">
                <h2><i class="fas fa-graduation-cap"></i> Mis Cursos</h2>
            </div>
            <div id="courses-panel-content" class="courses-list panel-loading">
                <div class="spinner-large"></div>
            </div>
        </section>

        <!-- TAB: MI PROGRESO -->
        <section id="panel-progress" class="tab-panel">
            <div class="panel-header">
                <h2><i class="fas fa-chart-line"></i> Mi Progreso</h2>
            </div>

            <div class="progress-cards-grid">

                <!-- Nivel actual -->
                <div class="prog-card">
                    <div class="prog-card-icon"><i class="fas fa-medal"></i></div>
                    <div class="prog-card-body">
                        <p class="prog-label">Nivel actual</p>
                        <span id="prog-level-val" class="prog-val level-rookie">Rookie</span>
                        <p class="prog-hint">Los niveles son: Rookie → Pro Dealer → Élite VIP</p>
                    </div>
                </div>

                <!-- Asistencia -->
                <div class="prog-card">
                    <div class="prog-card-icon"><i class="fas fa-calendar-check"></i></div>
                    <div class="prog-card-body">
                        <p class="prog-label">Asistencia</p>
                        <span id="prog-att-val" class="prog-val">--</span>
                        <div class="prog-bar-wrap">
                            <div class="prog-bar-track">
                                <div id="prog-att-bar" class="prog-bar-fill" style="width:0%"></div>
                            </div>
                            <span id="prog-att-pct" class="prog-bar-pct">0%</span>
                        </div>
                    </div>
                </div>

                <!-- Nota -->
                <div class="prog-card">
                    <div class="prog-card-icon"><i class="fas fa-star"></i></div>
                    <div class="prog-card-body">
                        <p class="prog-label">Nota promedio</p>
                        <span id="prog-grade-val" class="prog-val">--</span>
                        <div class="prog-bar-wrap">
                            <div class="prog-bar-track">
                                <div id="prog-grade-bar" class="prog-bar-fill prog-bar-gold" style="width:0%"></div>
                            </div>
                            <span id="prog-grade-pct" class="prog-bar-pct">0%</span>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- TAB: MIS TAREAS -->
        <section id="panel-tasks" class="tab-panel">
            <div class="panel-header">
                <h2><i class="fas fa-tasks"></i> Mis Tareas</h2>
            </div>
            <div id="tasks-panel-content" class="tasks-list panel-loading">
                <div class="spinner-large"></div>
            </div>
        </section>

        <!-- TAB: MATERIAL DIDÁCTICO -->
        <section id="panel-materials" class="tab-panel">
            <div class="panel-header">
                <h2><i class="fas fa-book-open"></i> Material Didáctico</h2>
            </div>
            <div id="materials-panel-content" class="materials-grid panel-loading">
                <div class="spinner-large"></div>
            </div>
        </section>

    </main>

    <footer class="dash-footer">
        <p>&copy; 2025 DealerClub. Todos los derechos reservados.</p>
    </footer>

</div><!-- /#dash-body -->

<script type="module" src="../assets/js/student_dashboard.js"></script>
</body>
</html>
