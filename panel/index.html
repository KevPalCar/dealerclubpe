<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<link rel="icon" href="favicon.png" />
<title>DealerClub · Panel</title>
<style>
  :root { --bg:#0e0e10; --panel:#17171b; --line:#26262c; --gold:#e9b949; --txt:#ececf0; --muted:#9a9aa3; --me:#1f5c3a; --them:#26262c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  button { cursor:pointer; font:inherit; }
  /* Login */
  #login { max-width:340px; margin:12vh auto; padding:24px; background:var(--panel); border:1px solid var(--line); border-radius:14px; }
  #login h1 { font-size:20px; margin:0 0 4px; } #login p { color:var(--muted); margin:0 0 16px; font-size:13px; }
  #login input { width:100%; padding:11px; margin:6px 0; background:#0e0e10; border:1px solid var(--line); border-radius:8px; color:var(--txt); }
  .btn { background:var(--gold); color:#1a1a1a; border:none; border-radius:8px; padding:11px 14px; font-weight:600; }
  .btn:disabled, .ghost:disabled { opacity:.45; cursor:default; }
  .err { color:#ff7a7a; font-size:13px; min-height:18px; }
  /* App */
  #app { display:none; height:100vh; grid-template-columns:320px 1fr; }
  .col { border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .top { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--line); }
  .top b { color:var(--gold); }
  .list { overflow-y:auto; flex:1; }
  .item { padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover, .item.active { background:#1d1d22; }
  .item .nm { font-weight:600; font-size:14px; display:flex; justify-content:space-between; gap:8px; }
  .item .ls { color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .pill { font-size:10.5px; background:#5b2330; color:#ffb3b3; padding:1px 7px; border-radius:10px; }
  /* Chat */
  #chat { display:flex; flex-direction:column; min-height:0; }
  #chatTop { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #msgs { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; background:#0b0b0d; }
  .b { max-width:74%; padding:8px 11px; border-radius:12px; font-size:14px; white-space:pre-wrap; word-wrap:break-word; }
  .them { background:var(--them); align-self:flex-start; border-bottom-left-radius:3px; }
  .me { background:var(--me); align-self:flex-end; border-bottom-right-radius:3px; }
  .imgmsg { display:block; max-width:240px; max-height:320px; border-radius:8px; cursor:pointer; }
  .medmsg { display:block; max-width:240px; }
  .doclink { color:var(--gold); text-decoration:none; font-weight:600; }
  .cap { margin-top:4px; font-size:13px; }
  /* Estado de entrega bajo cada mensaje nuestro */
  .st { margin-top:4px; font-size:11px; text-align:right; opacity:.7; white-space:normal; }
  .st.read { color:#7fd0ff; opacity:1; }
  .st.wait { color:#ffd27f; opacity:1; }
  .ls.fail { color:#ff9c9c; }
  .b.fail { background:#5b2330; }
  .b.fail .st { color:#ffd7d7; opacity:1; text-align:left; font-size:12px; }
  /* Menú del botón Catálogo */
  .composer { position:relative; }
  #brochureMenu { display:none; position:absolute; left:10px; bottom:60px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; z-index:5; }
  #brochureMenu button { display:block; width:100%; text-align:left; background:transparent; color:var(--txt); border:none; border-radius:6px; padding:9px 12px; }
  #brochureMenu button:hover { background:#26262c; }
  .banner { background:#5b2330; color:#ffd7d7; padding:8px 12px; font-size:13px; text-align:center; }
  .banner a { display:inline-block; margin-top:6px; color:#fff; background:#25d366; border-radius:6px; padding:5px 10px; text-decoration:none; font-weight:600; }
  .composer { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
  .composer textarea { flex:1; resize:none; height:44px; padding:10px; background:#0e0e10; border:1px solid var(--line); border-radius:8px; color:var(--txt); }
  .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12.5px; }
  .empty { color:var(--muted); margin:auto; font-size:14px; }
  /* Visor de imágenes a pantalla completa */
  #lightbox { display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.88); align-items:center; justify-content:center; padding:16px; }
  #lightbox img { max-width:100%; max-height:100%; object-fit:contain; border-radius:6px; }
  #lightbox .lbbar { position:absolute; top:12px; right:12px; display:flex; gap:8px; }
  #lightbox .lbbar a, #lightbox .lbbar button { background:rgba(255,255,255,.12); color:#fff; border:none; border-radius:8px; padding:8px 12px; text-decoration:none; font-size:14px; }
  /* Grabación de nota de voz */
  #recBar { display:none; flex:1; align-items:center; gap:10px; padding:0 6px; color:var(--txt); }
  #recBar .dot { width:10px; height:10px; border-radius:50%; background:#ff4d4d; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .composer.recording #reply, .composer.recording #brochureBtn, .composer.recording #attachBtn, .composer.recording #micBtn, .composer.recording #sendBtn { display:none; }
  .composer.recording #recBar { display:flex; }
  @media (max-width:720px){
    #app { grid-template-columns:1fr; }
    .col.hide-m { display:none; } #chat.show-m { display:flex; }
    #chat { display:none; }
  }
</style>
</head>
<body>
  <div id="login">
    <img src="isotipo.png" alt="DealerClub" style="height:64px;display:block;margin:0 auto 12px" />
    <h1 style="text-align:center">DealerClub · Panel</h1>
    <p>Atención de leads de WhatsApp</p>
    <input id="email" type="email" placeholder="Correo" autocomplete="username" />
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" />
    <button id="loginBtn" class="btn" style="width:100%;margin-top:8px">Entrar</button>
    <p class="err" id="loginErr"></p>
  </div>

  <div id="app">
    <div class="col" id="listCol">
      <div class="top"><span style="display:flex;align-items:center;gap:8px"><img src="isotipo.png" alt="" style="height:26px" /><b>DealerClub</b></span><span style="display:flex;gap:6px"><button class="ghost" id="newChat">＋ Nuevo</button><button class="ghost" id="logout">Salir</button></span></div>
      <div class="list" id="list"></div>
    </div>
    <div id="chat">
      <div id="chatTop"><span id="chatTitle"></span>
        <span style="display:flex;gap:6px">
          <button class="ghost" id="backBtn" style="display:none">←</button>
          <button class="ghost" id="toggleBot"></button>
        </span>
      </div>
      <div id="msgs"></div>
      <div class="banner" id="winBanner" style="display:none"><span id="winText"></span><br>
        <a id="winPhone" href="#" target="_blank" rel="noopener" title="Abre WhatsApp en este dispositivo con el mensaje del cuadro. Sale desde el número que tengas ahí, no desde el de la empresa, y no queda en este panel.">📱 Escribirle desde mi WhatsApp (gratis)</a></div>
      <div class="composer">
        <div id="brochureMenu">
          <button data-tipo="escuela">♠️ Escuela de Dealers</button>
          <button data-tipo="eventos">🎰 Casino de Fantasía</button>
        </div>
        <button class="ghost" id="brochureBtn" title="Envía el catálogo vigente (el mismo PDF y texto que manda el bot). Funciona aunque el bot esté en pausa.">📄 Catálogo</button>
        <label class="ghost" for="fileInput" id="attachBtn" title="Adjuntar archivo" style="display:flex;align-items:center;cursor:pointer">📎</label>
        <input id="fileInput" type="file" style="display:none" accept="image/*,video/*,audio/*,application/pdf,.pdf,.doc,.docx" />
        <textarea id="reply" placeholder="Escribe como DealerClub…"></textarea>
        <button class="ghost" id="micBtn" title="Grabar una nota de voz y enviarla al cliente como audio de WhatsApp. Pausa el bot en este chat, igual que al responder.">🎤</button>
        <button class="btn" id="sendBtn">Enviar</button>
        <div id="recBar">
          <span class="dot"></span><span id="recTime">0:00</span>
          <span style="flex:1;color:var(--muted);font-size:13px">Grabando nota de voz…</span>
          <button class="ghost" id="recCancel">✕ Cancelar</button>
          <button class="btn" id="recSend">➤ Enviar audio</button>
        </div>
      </div>
    </div>
  </div>

  <div id="lightbox">
    <div class="lbbar"><a id="lbDown" href="#">⬇ Descargar</a><button id="lbClose">✕ Cerrar</button></div>
    <img id="lbImg" alt="" />
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-functions.js";
import { webmToOgg } from "./webm2ogg.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3YsyUDmLeAvvgWwvCnjeJt-HbGGk--PY",
  authDomain: "dealerclubpe.firebaseapp.com",
  projectId: "dealerclubpe",
  storageBucket: "dealerclubpe.firebasestorage.app",
  messagingSenderId: "330568352415",
  appId: "1:330568352415:web:9fcd7651698bfafac998aa"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const fns = getFunctions(app, "us-central1");
const call = (n) => httpsCallable(fns, n);

const $ = (id) => document.getElementById(id);
let current = null, listTimer = null, chatTimer = null;
// storagePath -> promesa de blob: URL (evita recargar en cada poll). Blob y no
// data: URL para que audio/video puedan adelantarse y abrirse en otra pestaña.
const mediaCache = {};
// storagePath -> elemento <img>/<audio>/<video> ya creado. El chat se repinta
// cada 4 s; reutilizar el elemento evita que un audio en curso se corte.
let mediaEls = {};
let lastHistory = "";

function getMedia(path) {
  if (!mediaCache[path]) {
    mediaCache[path] = call("adminGetMedia")({ path })
      .then(({ data }) => fetch(data.dataUrl))
      .then((r) => r.blob())
      .then((blob) => URL.createObjectURL(blob));
    mediaCache[path].catch(() => delete mediaCache[path]); // reintenta en el próximo poll
  }
  return mediaCache[path];
}
async function setSrc(el, path) {
  try { el.src = await getMedia(path); }
  catch (e) { el.alt = "no se pudo cargar"; delete mediaEls[path]; lastHistory = ""; } // reintenta en el próximo poll
}
function mediaEl(tag, path, setup) {
  let el = mediaEls[path];
  if (!el || el.tagName !== tag.toUpperCase()) {
    el = document.createElement(tag);
    setup(el);
    setSrc(el, path);
    mediaEls[path] = el;
  }
  return el;
}
// Documentos: se abren en pestaña nueva.
async function openMedia(path) {
  try { window.open(await getMedia(path), "_blank"); }
  catch (e) { alert("No se pudo abrir el archivo."); }
}
// Imágenes: se ven en grande aquí mismo.
async function showImage(path) {
  try {
    const url = await getMedia(path);
    $("lbImg").src = url;
    $("lbDown").href = url;
    $("lbDown").download = path.split("/").pop();
    $("lightbox").style.display = "flex";
  } catch (e) { alert("No se pudo abrir la imagen."); }
}
function closeImage() { $("lightbox").style.display = "none"; $("lbImg").src = ""; }
$("lightbox").onclick = (e) => { if (e.target.id === "lightbox" || e.target.id === "lbClose") closeImage(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeImage(); });

// ---- Login ----
$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  $("loginBtn").disabled = true;
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
  } catch (e) {
    $("loginErr").textContent = "No se pudo entrar. Revisa correo/contraseña.";
  }
  $("loginBtn").disabled = false;
};
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (user) {
    $("login").style.display = "none";
    $("app").style.display = "grid";
    refreshList();
    listTimer = setInterval(refreshList, 5000);
    handleDeepLink();
  } else {
    $("app").style.display = "none";
    $("login").style.display = "block";
    clearInterval(listTimer); clearInterval(chatTimer);
  }
});

// Enlace desde el admin web: ?to=<numero>&msg=<texto> → abre ese chat y autollena.
async function handleDeepLink() {
  const p = new URLSearchParams(location.search);
  const to = (p.get("to") || "").replace(/\D/g, "");
  if (!to) return;
  const msg = p.get("msg") || "";
  history.replaceState({}, "", location.pathname); // limpia la URL
  try {
    await call("adminStartChat")({ phone: to });
    await refreshList();
    openChat(to, "+" + to);
    if (msg) $("reply").value = msg;
  } catch (e) { alert("No se pudo abrir el chat: " + (e.message || e)); }
}

// ---- Lista ----
async function refreshList() {
  try {
    const { data } = await call("adminListConversations")();
    const list = $("list");
    list.innerHTML = "";
    if (!data.length) { list.innerHTML = '<p class="empty" style="padding:20px">Aún no hay conversaciones.</p>'; return; }
    for (const c of data) {
      const div = document.createElement("div");
      div.className = "item" + (current === c.phone ? " active" : "");
      const name = c.name || ("+" + c.phone);
      div.innerHTML = `<div class="nm"><span>${esc(name)}</span>${c.humanTakeover ? '<span class="pill">pausado</span>' : ''}</div>
        <div class="ls${c.lastFailed ? ' fail' : ''}">${c.lastFailed ? '⚠ No entregado: ' : c.lastRole === 'user' ? '' : '✓ '}${esc(c.last || '')}</div>`;
      div.onclick = () => openChat(c.phone, name);
      list.appendChild(div);
    }
  } catch (e) {
    console.error(e);
    $("list").innerHTML = '<div class="banner">No se pudieron cargar los chats.<br>' +
      esc((e && (e.message || e.code)) || String(e)) + '</div>';
  }
}

// ---- Chat ----
async function openChat(phone, name) {
  if (current !== phone) { mediaEls = {}; lastHistory = ""; }
  current = phone;
  $("chat").classList.add("show-m"); $("listCol").classList.add("hide-m");
  $("backBtn").style.display = window.innerWidth <= 720 ? "" : "none";
  $("chatTitle").innerHTML = `<b>${esc(name)}</b> · +${phone}`;
  await loadChat();
  clearInterval(chatTimer);
  chatTimer = setInterval(loadChat, 4000);
  refreshList();
}
$("backBtn").onclick = () => { $("chat").classList.remove("show-m"); $("listCol").classList.remove("hide-m"); current = null; clearInterval(chatTimer); };

async function loadChat() {
  if (!current) return;
  try {
    const { data } = await call("adminGetConversation")({ phone: current });
    const box = $("msgs");
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    // Solo se repinta si algo cambió (mensaje nuevo o estado de entrega).
    const sig = JSON.stringify(data.history);
    const changed = sig !== lastHistory;
    lastHistory = sig;
    const rows = [];
    for (const m of changed ? data.history : []) {
      const d = document.createElement("div");
      d.className = "b " + (m.role === "user" ? "them" : "me");
      if (m.storagePath && (m.type === "image" || m.type === "sticker")) {
        d.appendChild(mediaEl("img", m.storagePath, (img) => {
          img.className = "imgmsg";
          img.onclick = () => showImage(m.storagePath);
        }));
      } else if (m.storagePath && m.type === "audio") {
        d.appendChild(mediaEl("audio", m.storagePath, (a) => {
          a.controls = true; a.preload = "metadata"; a.className = "medmsg";
        }));
      } else if (m.storagePath && m.type === "video") {
        d.appendChild(mediaEl("video", m.storagePath, (v) => {
          v.controls = true; v.className = "imgmsg";
        }));
      } else if (m.storagePath && m.type === "document") {
        const link = document.createElement("a");
        link.href = "#"; link.className = "doclink";
        link.textContent = "📄 " + (m.filename || "documento");
        link.onclick = (e) => { e.preventDefault(); openMedia(m.storagePath); };
        d.appendChild(link);
      } else {
        d.textContent = m.text;
      }
      if (m.storagePath && m.caption) {
        const cap = document.createElement("div");
        cap.className = "cap"; cap.textContent = m.caption;
        d.appendChild(cap);
      }
      // Estado de entrega que reporta WhatsApp (solo en lo que enviamos).
      if (m.role !== "user" && (m.waId || m.status)) {
        const st = document.createElement("div");
        st.className = "st";
        if (m.status === "failed") {
          d.classList.add("fail");
          st.textContent = "⚠ NO ENTREGADO. " + (m.error || "WhatsApp no lo entregó.");
        } else if (m.status === "read") { st.classList.add("read"); st.textContent = "✓✓ leído"; }
        else if (m.status === "delivered") st.textContent = "✓✓ entregado";
        else { st.classList.add("wait"); st.textContent = "✓ enviado · WhatsApp aún no confirma que llegó"; }
        d.appendChild(st);
      }
      rows.push(d);
    }
    if (changed) {
      // Mover un <audio> que suena y volver a insertarlo en el mismo paso no lo pausa.
      box.replaceChildren(...rows);
      if (atBottom) box.scrollTop = box.scrollHeight;
    }
    // Ventana de 24 h cerrada: WhatsApp descartaría lo que se envíe.
    // Si nunca escribió, tampoco se le puede escribir primero desde la empresa.
    const closed = data.window === "closed";
    $("winBanner").style.display = closed ? "block" : "none";
    if (closed) {
      const horas = Math.floor((Date.now() - data.lastInboundAt) / 3600000);
      $("winText").textContent = (data.lastInboundAt
        ? "No puedes escribirle desde la empresa: su último mensaje fue hace " + horas + " h y WhatsApp solo permite responder gratis dentro de las 24 h."
        : "Esta persona aún no ha escrito al WhatsApp de la empresa, y WhatsApp no deja escribirle primero sin plantilla de pago.") +
        " Cuando te escriba, se habilita solo.";
    }
    for (const id of ["sendBtn", "brochureBtn", "micBtn"]) $(id).disabled = closed;
    $("attachBtn").style.opacity = closed ? ".4" : "";
    $("attachBtn").style.pointerEvents = closed ? "none" : "";
    const tb = $("toggleBot");
    tb.textContent = data.humanTakeover ? "▶ Reactivar bot" : "⏸ Pausar bot";
    tb.onclick = async () => { await call("adminSetTakeover")({ phone: current, value: !data.humanTakeover }); loadChat(); refreshList(); };
  } catch (e) { console.error(e); }
}

// Alternativa gratis con la ventana cerrada: WhatsApp del propio celular/PC.
$("winPhone").onclick = () => {
  $("winPhone").href = "https://wa.me/" + current + "?text=" + encodeURIComponent($("reply").value.trim());
};

$("sendBtn").onclick = async () => {
  const t = $("reply").value.trim();
  if (!t || !current) return;
  $("sendBtn").disabled = true;
  try {
    await call("adminSendReply")({ phone: current, text: t });
    $("reply").value = "";
  } catch (e) { alert("No se pudo enviar: " + (e.message || e)); }
  $("sendBtn").disabled = false;
  await loadChat(); refreshList();   // loadChat decide si el botón sigue habilitado
};

// Enviar el catálogo vigente con un clic (sirve con el bot en pausa)
$("brochureBtn").onclick = () => {
  const m = $("brochureMenu");
  m.style.display = m.style.display === "block" ? "none" : "block";
};
document.addEventListener("click", (e) => {
  if (!e.target.closest("#brochureBtn, #brochureMenu")) $("brochureMenu").style.display = "none";
});
$("brochureMenu").querySelectorAll("button").forEach((b) => {
  b.onclick = async () => {
    $("brochureMenu").style.display = "none";
    if (!current) return;
    if (!confirm("¿Enviar el catálogo de " + b.textContent.trim() + " a este chat?")) return;
    $("brochureBtn").textContent = "⏳ Enviando…";
    try {
      await call("adminSendBrochure")({ phone: current, tipo: b.dataset.tipo });
      await loadChat(); refreshList();
    } catch (e) { alert("No se pudo enviar el catálogo: " + (e.message || e)); }
    $("brochureBtn").textContent = "📄 Catálogo";
  };
});

// Nuevo chat con cualquier número
$("newChat").onclick = async () => {
  const raw = prompt("Escribir a un número nuevo.\nPon el número con código de país (solo dígitos), ej. 51999888777:");
  if (!raw) return;
  let phone = raw.replace(/\D/g, "");
  if (phone.length === 9) phone = "51" + phone;   // celular peruano sin código de país
  if (phone.length < 8) { alert("Número inválido. Incluye el código de país (ej. 51...)."); return; }
  try {
    await call("adminStartChat")({ phone });
    await refreshList();
    openChat(phone, "+" + phone);
  } catch (e) { alert("No se pudo abrir el chat: " + (e.message || e)); }
};

// Adjuntar y enviar un archivo (imagen/pdf/audio/video)
$("fileInput").onchange = async () => {
  const file = $("fileInput").files[0];
  if (!file || !current) return;
  if (file.size > 10 * 1024 * 1024) { alert("Archivo muy grande (máx 10 MB)."); $("fileInput").value = ""; return; }
  const caption = $("reply").value.trim();
  $("attachBtn").textContent = "⏳";
  try {
    await sendFile(current, file, file.type || "application/octet-stream", file.name, caption);
    $("reply").value = "";
    await loadChat(); refreshList();
  } catch (e) { alert("No se pudo enviar el archivo: " + (e.message || e)); }
  $("attachBtn").textContent = "📎";
  $("fileInput").value = "";
};

async function sendFile(phone, blob, mime, filename, caption) {
  const dataUrl = await new Promise((res, rej) => {
    const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob);
  });
  const dataBase64 = String(dataUrl).split(",")[1];
  await call("adminSendMedia")({ phone, dataBase64, mime, filename, caption });
}

// ---- Nota de voz ----
// WhatsApp acepta audio OGG/Opus en mono. Firefox lo graba directo; Chrome/Edge
// graban WebM/Opus (se reempaqueta a OGG sin recodificar) y Safari MP4 (AAC).
let rec = null;
$("micBtn").onclick = async () => {
  if (!current || rec) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) { alert("Este navegador no permite grabar audio."); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { alert("No se pudo usar el micrófono. Revisa que el navegador tenga permiso."); return; }
  // Forzar mono pasando por un AudioContext (algunos micrófonos entregan estéreo).
  const ctx = new AudioContext();
  await ctx.resume();
  const dest = ctx.createMediaStreamDestination();
  dest.channelCount = 1;
  ctx.createMediaStreamSource(stream).connect(dest);
  const mime = ["audio/ogg;codecs=opus", "audio/webm;codecs=opus", "audio/mp4"].find((t) => MediaRecorder.isTypeSupported(t));
  const mr = new MediaRecorder(dest.stream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : undefined);
  const chunks = [];
  mr.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  const started = Date.now();
  rec = { mr, phone: current, timer: setInterval(() => {
    const s = Math.floor((Date.now() - started) / 1000);
    $("recTime").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }, 500) };
  rec.done = new Promise((res) => { mr.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    ctx.close();
    res(new Blob(chunks, { type: mr.mimeType }));
  }; });
  $("recTime").textContent = "0:00";
  $("micBtn").closest(".composer").classList.add("recording");
  mr.start();
};

async function stopRec() {
  const r = rec;
  rec = null;
  clearInterval(r.timer);
  r.mr.stop();
  $("micBtn").closest(".composer").classList.remove("recording");
  return { phone: r.phone, blob: await r.done };
}

$("recCancel").onclick = () => { if (rec) stopRec(); };
$("recSend").onclick = async () => {
  if (!rec) return;
  const { phone, blob } = await stopRec();
  $("micBtn").textContent = "⏳"; $("micBtn").disabled = true;
  try {
    let out = blob, mime = "audio/ogg", name = "nota-de-voz.ogg";
    if (blob.type.includes("webm")) out = new Blob([webmToOgg(new Uint8Array(await blob.arrayBuffer()))], { type: mime });
    else if (blob.type.includes("mp4")) { mime = "audio/mp4"; name = "nota-de-voz.m4a"; }
    await sendFile(phone, out, mime, name, "");
  } catch (e) { alert("No se pudo enviar el audio: " + (e.message || e)); }
  $("micBtn").textContent = "🎤"; $("micBtn").disabled = false;
  await loadChat(); refreshList();
};

function esc(s){ return (s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
</script>
